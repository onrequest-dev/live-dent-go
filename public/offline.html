<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال بالإنترنت</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #334155;
            text-align: center;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            color: #0f172a;
        }

        p {
            max-width: 300px;
            line-height: 1.6;
        }

        button {
            margin-top: 1.5rem;
            padding: 10px 20px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="icon">📡</div>
    <h1>انقطع الاتصال</h1>
    <p>يبدو أنك غير متصل بالإنترنت. يرجى التحقق من شبكتك والمحاولة مرة أخرى.</p>
    <p style="font-size: 0.9rem; color: #64748b;">(ملاحظة: البيانات المحفوظة مسبقاً ستظل متاحة)</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
    <button onclick="window.history.back()">العودة إلى الصفحة السابقة</button>
</body>

</html>
